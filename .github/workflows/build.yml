# Build gate (docs/CODING-STANDARDS.md, §7.3). `npm run build` is the chain run locally:
# typecheck, standards, dead code, migrations, unit tests, integration tests, bundle,
# bindings, artifact verification, stopping at the first failure. End-to-end tests run as
# a separate job against the built server. Each job gets a disposable PostgreSQL 18.6; the
# credentials below exist only inside that container.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOST: 127.0.0.1
  PORT: "5175"
  BETTER_AUTH_URL: http://127.0.0.1:5175
  BETTER_AUTH_SECRET: ci-only-session-secret-not-used-anywhere-else
  DATABASE_URL: postgres://apple_music_app:ci-app-password@127.0.0.1:5432/apple_music_test
  DATABASE_AUTH_URL: postgres://apple_music_auth:ci-auth-password@127.0.0.1:5432/apple_music_test
  DATABASE_ADMIN_URL: postgres://apple_music_owner:ci-owner-password@127.0.0.1:5432/apple_music_test
  OWNER_EMAIL: owner@example.test
  OWNER_NAME: Library Owner
  OWNER_PASSWORD: correct-horse-battery

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: apple_music_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: apple_music_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apple_music_owner -d apple_music_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Composed build
        run: npm run build
        env:
          MIGRATIONS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: apple_music_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: apple_music_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apple_music_owner -d apple_music_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run bundle
      - run: npm run test:e2e
